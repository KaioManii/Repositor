name: Build Pixel Runner APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'pixel_runner_android_project.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Descompactar projeto
        run: |
          unzip -o pixel_runner_android_project.zip -d projeto
          find projeto -name gradlew -type f

      - name: Compilar APK
        run: |
          cd projeto/pixel_runner_android
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PixelRunner-APK
          path: projeto/pixel_runner_android/app/build/outputs/apk/debug/*.apk
